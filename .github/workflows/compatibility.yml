name: Kernel compatibility

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: kernel-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kernel: [4.19.325, 5.4.290, 5.10.240, 6.6.110]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
      - name: Install guest and kernel build tools
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 5m sudo apt-get -o Acquire::Retries=3 update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt metadata update failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep 10
          done
          timeout 10m sudo apt-get install -y qemu-system-x86 qemu-guest-agent ovmf build-essential flex bison libssl-dev libelf-dev bc iptables iproute2
      - name: Cache test kernel
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/test-kernel/bzImage
            ${{ runner.temp }}/test-kernel/kernel.config
          key: ebpf-kernel-${{ matrix.kernel }}-${{ hashFiles('.github/scripts/build-test-kernel.sh') }}
      - name: Build pinned test kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-test-kernel.sh ${{ matrix.kernel }} "${{ runner.temp }}/test-kernel"
      - name: Save compiled test kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/test-kernel/bzImage
            ${{ runner.temp }}/test-kernel/kernel.config
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}
      - name: Install pinned VM runner
        run: cargo install vmtest --version 0.18.0 --locked
      - name: Build integration binaries
        run: |
          mkdir -p .kernel-tests/bin
          # The pinned kernels provide built-in legacy NAT. Avoid depending on
          # the host distribution's nftables default or guest kernel modules.
          ln -s "$(command -v iptables-legacy)" .kernel-tests/bin/iptables
          CGO_ENABLED=0 go test -c -tags with_ebpf,ebpf_integration -o .kernel-tests/core.test ./internal/core
          CGO_ENABLED=0 go test -c -tags with_ebpf,ebpf_integration -o .kernel-tests/runtime.test ./runtime
      - name: Test selected paths in guest kernel
        shell: bash
        run: |
          set -euo pipefail
          sudo "$HOME/.cargo/bin/vmtest" -k "${{ runner.temp }}/test-kernel/bzImage" 'bash .github/scripts/run-kernel-tests.sh' 2>&1 | tee kernel-test.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kernel-${{ matrix.kernel }}
          path: |
            kernel-test.log
            ${{ runner.temp }}/test-kernel/kernel.config
          retention-days: 14
